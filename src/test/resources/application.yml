spring:
  application:
    name: wash
  datasource:
    url: jdbc:h2:mem:wash;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  public-base-url: http://test.local
  storage:
    endpoint: http://127.0.0.1:9000
    access-key:
    secret-key:
    bucket: wash-model-images
  seed:
    enabled: false

logging:
  level:
    com.hls.wash: WARN
